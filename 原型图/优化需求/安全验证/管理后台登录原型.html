<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>易面管理后台 - 登录原型</title>
<style>
:root{color-scheme:light;box-sizing:border-box;--blue:#3399ff;--line:#dcdfe6;--err:#f56c6c;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"PingFang SC","Helvetica Neue",Arial,"Microsoft YaHei",sans-serif;color:#303133}
body{background:#5a9fe0;min-height:100vh;display:flex;flex-direction:column}
.stage{flex:1;display:flex;align-items:center;justify-content:space-around;padding:32px 24px;gap:32px;flex-wrap:wrap}
.slogan{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.2)}
.slogan h2{font-size:44px;font-weight:400;margin:0 0 28px;letter-spacing:2px}
.slogan p{font-size:20px;margin:0}
.card{width:380px;max-width:100%;background:#fff;padding:40px 36px 32px;box-shadow:0 4px 20px rgba(0,0,0,.12)}
.lg{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:34px;color:#555}
.lg i{width:44px;height:40px;border:4px solid var(--blue);border-radius:11px 11px 11px 3px;display:flex;align-items:center;justify-content:center;font:700 22px Arial;font-style:normal;color:var(--blue)}
.lg b{font-size:34px;font-weight:300;line-height:1}
.lg small{display:block;font-size:10px;letter-spacing:.3px;margin-top:2px}
.f{display:flex;border:1px solid var(--line);height:44px;margin-bottom:6px;background:#fff}
.f:focus-within{border-color:var(--blue)}
.f.bad{border-color:var(--err)}
.f input{flex:1;border:0;outline:0;padding:0 16px;font:inherit;font-size:15px;min-width:0;background:transparent}
.f input::placeholder{color:#909399}
.f .ic{width:44px;display:flex;align-items:center;justify-content:center;color:#909399;font-size:18px}
.cap{width:130px;display:flex;align-items:center;justify-content:center;font:italic 800 26px Arial,sans-serif;color:#2f93f0;letter-spacing:1px;cursor:pointer;user-select:none;transform:skewX(-6deg)}
.sms{border:0;border-left:1px solid var(--line);background:#fff;color:var(--blue);font:inherit;font-size:14px;padding:0 14px;cursor:pointer;white-space:nowrap}
.sms:disabled{color:#a8abb2;cursor:not-allowed}
.m{font-size:12px;color:var(--err);min-height:20px;margin-bottom:6px}
.act{display:flex;align-items:center;gap:20px;margin-top:10px}
.btn{flex:1;height:44px;border:0;background:var(--blue);color:#fff;font:inherit;font-size:18px;cursor:pointer}
.ata{width:46px;height:46px;border-radius:50%;background:#d7141a;color:#fff;font:700 13px/1 Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #f3d1d1}
.ata small{font-size:6px;font-weight:400;background:#fff;color:#d7141a;padding:0 3px;margin-top:2px}
.sub{display:flex;justify-content:space-between;margin-top:20px;font-size:15px}
.sub a{color:var(--blue);cursor:pointer}
.h{font-size:20px;text-align:center;margin:0 0 26px;font-weight:500;color:#303133}
.view{display:none}.view.on{display:block}
.done{text-align:center;padding:6px 0 4px}
.done .big{width:60px;height:60px;border-radius:50%;background:#52c41a;color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
footer{text-align:center;color:#e3efff;font-size:13px;padding:0 0 22px}
@media(max-width:760px){.slogan{display:none}}
</style>
</head>
<body>
<div class="stage">
  <div class="slogan"><h2>面试管理专家</h2><p>大型招聘面试的好帮手</p></div>

  <div class="card">
    <div class="lg"><i>m</i><div><b>易面</b><small>EASY INTERVIEW</small></div></div>

    <section class="view on" id="v1">
      <div class="f" id="w-u"><input id="u" placeholder="用户名" autocomplete="off"><span class="ic">&#9786;</span></div><div class="m" id="m-u"></div>
      <div class="f" id="w-p"><input id="p" type="password" placeholder="密码"><span class="ic">&#128274;</span></div><div class="m" id="m-p"></div>
      <div class="f" id="w-c"><input id="c" placeholder="验证码" maxlength="4" autocomplete="off"><span class="cap" id="cap" title="点击刷新">K2OE</span></div><div class="m" id="m-c"></div>
      <div class="act"><button class="btn" id="b1">登录</button><div class="ata">ATA<small>统一登录</small></div></div>
      <div class="sub"><label><input type="checkbox"> 记住密码</label><a>忘记密码</a></div>
    </section>

    <section class="view" id="v2">
      <h3 class="h">手机验证</h3>
      <div class="f" id="w-ph"><input id="ph" placeholder="请输入手机号" maxlength="11" inputmode="numeric"></div><div class="m" id="m-ph"></div>
      <div class="f" id="w-s"><input id="s" placeholder="请输入验证码" maxlength="6" inputmode="numeric"><button class="sms" id="sms">获取验证码</button></div><div class="m" id="m-s"></div>
      <div class="act"><button class="btn" id="b2">登录</button></div>
      <div class="sub" style="justify-content:center"><a id="bk">返回登录</a></div>
    </section>

    <section class="view" id="v3">
      <div class="done"><div class="big">✓</div><h3 class="h" style="margin:0 0 22px">登录成功</h3></div>
      <div class="act"><button class="btn" id="rs">进入管理后台</button></div>
    </section>
  </div>
</div>
<footer>Copyright © ATA, inc. All rights reserved.　|　京ICP备10049371号-44</footer>

<script>
var $=function(i){return document.getElementById(i)},tm=null,sent=false,cc='K2OE';
function show(v){var a=document.querySelectorAll('.view');for(var i=0;i<a.length;i++)a[i].classList.remove('on');$(v).classList.add('on')}
function err(id,t){$('m-'+id).textContent=t||'';$('w-'+id).classList.toggle('bad',!!t)}
function newCap(){var c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(var i=0;i<4;i++)s+=c[Math.floor(Math.random()*c.length)];cc=s;$('cap').textContent=s}
$('cap').onclick=newCap;
$('b1').onclick=function(){var ok=true;
  err('u');err('p');err('c');
  if(!$('u').value.trim()){err('u','请输入用户名');ok=false}
  if(!$('p').value){err('p','请输入密码');ok=false}
  if(!$('c').value.trim()){err('c','请输入验证码');ok=false}
  if(ok)show('v2')};
$('sms').onclick=function(){err('ph');
  if(!/^1\d{10}$/.test($('ph').value)){err('ph','请输入正确的11位手机号');return}
  var n=60,b=this;b.disabled=true;b.textContent=n+'s 后重发';sent=true;
  clearInterval(tm);tm=setInterval(function(){n--;if(n<=0){clearInterval(tm);b.disabled=false;b.textContent='重新获取'}else b.textContent=n+'s 后重发'},1000)};
$('b2').onclick=function(){var ok=true;err('ph');err('s');
  if(!/^1\d{10}$/.test($('ph').value)){err('ph','请输入正确的11位手机号');ok=false}
  if(!$('s').value.trim()){err('s','请输入验证码');ok=false}else if(!sent){err('s','请先获取验证码');ok=false}
  if(ok)show('v3')};
function reset(){clearInterval(tm);sent=false;['u','p','c','ph','s'].forEach(function(i){$(i).value='';});
  ['u','p','c','ph','s'].forEach(function(i){err(i)});$('sms').disabled=false;$('sms').textContent='获取验证码';newCap();show('v1')}
$('bk').onclick=reset;$('rs').onclick=reset;
</script>
</body>
</html>
