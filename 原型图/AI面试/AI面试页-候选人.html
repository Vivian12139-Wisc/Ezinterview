
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .page-bg {
    background: linear-gradient(135deg, #1a8fe3 0%, #42b0f5 50%, #1a8fe3 100%);
    padding: 24px;
    border-radius: 12px;
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .interview-card {
    background: #fff;
    border-radius: 16px;
    width: 100%;
    max-width: 900px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.18);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 22px;
    border-bottom: 1px solid #eee;
    background: #fff;
  }
  .header-title { font-size: 15px; font-weight: 600; color: #222; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .header-timer {
    background: #f5f5f5;
    border: 1.5px solid #d0d0d0;
    border-radius: 8px;
    padding: 5px 18px;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 2px;
    color: #222;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .divider {
    width: 1px;
    height: 28px;
    background: #e8e8e8;
  }
  .user-info { display: flex; align-items: center; gap: 10px; }
  .user-avatar {
    width: 36px; height: 36px;
    border-radius: 6px; background: #cde;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #dde;
  }
  .user-meta { font-size: 13px; color: #333; line-height: 1.6; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .user-meta span { display: block; }
  .user-meta .label { color: #999; font-size: 11px; }

  .end-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    background: #e02020;
    border: none;
    border-radius: 8px;
    padding: 8px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    white-space: nowrap;
    transition: background 0.15s, transform 0.1s;
    font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
  }
  .end-btn:hover { background: #c01818; }
  .end-btn:active { transform: scale(0.97); }

  .body { display: flex; height: 420px; }
  .video-area {
    flex: 1; background: #1a1a1a;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .user-cam {
    width: 90px; height: 90px; border-radius: 50%;
    background: #3a3a3a; border: 2px solid #555;
    display: flex; align-items: center; justify-content: center;
  }
  .user-label {
    position: absolute; bottom: 100px; left: 16px;
    background: rgba(0,0,0,0.55); border-radius: 20px;
    padding: 4px 12px; color: #fff; font-size: 12px;
    display: flex; align-items: center; gap: 6px;
    font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
  }
  .mic-dot {
    width: 8px; height: 8px; background: #4dd;
    border-radius: 50%; animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .ai-avatar-box {
    position: absolute; bottom: 16px; right: 16px;
    width: 120px; height: 130px; background: #f8f8f4;
    border-radius: 14px; overflow: hidden;
    border: 2px solid rgba(255,255,255,0.15);
    display: flex; flex-direction: column; align-items: center;
  }
  .ai-avatar-face {
    flex: 1; width: 100%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(160deg, #f0ede8 0%, #e8e0d8 100%);
  }
  .ai-label-bar {
    width: 100%; background: rgba(0,0,0,0.5);
    text-align: center; color: #fff; font-size: 11px; padding: 4px 0;
    font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
  }
  .chat-panel {
    width: 280px; background: #fff;
    border-left: 1px solid #eee;
    display: flex; flex-direction: column;
    overflow-y: auto; padding: 16px 14px; gap: 10px;
  }
  .chat-msg-group { display: flex; flex-direction: column; gap: 4px; }
  .chat-sender { font-size: 11px; color: #aaa; margin-bottom: 2px; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .chat-bubble {
    background: #f5f7fa; border-radius: 10px;
    padding: 10px 13px; font-size: 13px; color: #333; line-height: 1.6;
    border: 0.5px solid #e8e8ee;
    font-family: 'PingFang SC','Microsoft YaHei',sans-serif;
  }
  .typing-cursor {
    display: inline-block; width: 2px; height: 14px;
    background: #4488ee; vertical-align: -2px; margin-left: 2px;
    animation: blink 0.9s step-end infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
</style>
