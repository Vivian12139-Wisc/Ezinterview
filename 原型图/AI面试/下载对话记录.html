function fmt(iso){const d=new Date(iso),p=n=>String(n).padStart(2,'0');return`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;}
function fmtT(iso){return fmt(iso).split(' ')[1];}
function duration(s,e){const ms=new Date(e)-new Date(s),m=Math.floor(ms/60000),sec=Math.floor((ms%60000)/1000);return`${m} 分 ${sec} 秒`;}

function buildTxt(iv){
  const dash='─'.repeat(52),name=iv.interview_subject,L=[];
  L.push('面试编号    '+iv.room_id);
  L.push('面试日程    '+iv.schedule);
  L.push('面试安排    '+iv.arrangement);
  L.push('面试对象    '+name);
  L.push('应聘岗位    '+iv.position);
  L.push('面试评分表  '+iv.score_sheet);
  L.push('面试官      '+iv.interviewer);
  L.push('开始时间    '+fmt(iv.start_time));
  L.push('结束时间    '+fmt(iv.end_time));
  L.push('持续时长    '+duration(iv.start_time,iv.end_time));
  L.push('对话轮次    '+iv.conversation.length+' 轮');
  L.push('');L.push(dash);L.push('');
  iv.conversation.forEach(msg=>{
    const speaker=msg.role==='assistant'?'【面试官】':`【${name}】`;
    L.push(`${speaker}  ${fmtT(msg.timestamp)}`);
    L.push(`  ${msg.content}`);
    L.push('');
  });
  L.push(dash);
  L.push('生成时间：'+fmt(new Date().toISOString()));
  return L.join('\n');
}

function downloadLog(idx){
  const iv=interviews[idx];
  const blob=new Blob(['\uFEFF'+buildTxt(iv)],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  window.open(url,'_blank');
  const t=document.getElementById('toast');
  t.textContent=`✓ 已在新标签页打开：${iv.interview_subject}_${iv.room_id}_面试对话记录.txt`;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2800);
}
