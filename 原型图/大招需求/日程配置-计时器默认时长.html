<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>日程配置 - 计时器默认时长</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#fff; color:#333; }

  .page { max-width:1000px; margin:0 auto; padding:40px 32px; }

  .section-head {
    display:flex; align-items:baseline; gap:14px; padding-bottom:22px; border-bottom:1px solid #f0f2f5; margin-bottom:8px;
  }
  .section-title { font-size:15px; font-weight:600; color:#1a1a1a; white-space:nowrap; }
  .section-tip { font-size:13px; color:#2f9bff; flex:1; }
  .collapse-btn { font-size:13px; color:#2f9bff; cursor:pointer; white-space:nowrap; display:flex; align-items:center; gap:4px; }

  .item-row {
    display:flex; gap:14px; padding:20px 0; align-items:flex-start;
  }
  .item-checkbox {
    width:18px; height:18px; border:1px solid #c7cdd6; border-radius:3px; flex-shrink:0; margin-top:3px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .item-checkbox.checked { background:#2f9bff; border-color:#2f9bff; color:#fff; font-size:12px; }
  .item-checkbox { user-select:none; }
  .item-icon {
    width:36px; height:36px; border-radius:6px; border:1px solid #dfe3e8; color:#8a94a3;
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
  }
  .item-icon.on { border-color:#2f9bff; color:#2f9bff; }
  .item-body { flex:1; }
  .item-title { font-size:14px; font-weight:600; color:#1a1a1a; margin-bottom:4px; }
  .item-desc { font-size:13px; color:#8a94a3; line-height:1.7; }
  .config-block { margin-top:16px; }
  .config-row { display:flex; align-items:center; padding:8px 0; font-size:13px; color:#333; }
  .config-label { color:#333; margin-right:2px; }
  .inline-input {
    display:inline-block; width:52px; border:none; border-bottom:1px solid #c7cdd6; text-align:center;
    font-size:13px; color:#333; padding:0 2px 1px; margin:0 2px; background:transparent;
  }
  .inline-input:focus { outline:none; border-color:#2f9bff; }

  .hms-input {
    display:inline-block; width:32px; border:none; border-bottom:1px solid #c7cdd6; text-align:center;
    font-size:13px; color:#333; padding:0 2px 1px; margin:0 2px; background:transparent;
  }
  .hms-input:focus { outline:none; border-color:#2f9bff; }

  .shortcut-list { margin-top:2px; }
  .shortcut-row {
    display:flex; align-items:center; gap:10px; padding:8px 0;
  }
  .shortcut-label { font-size:13px; color:#8a94a3; width:56px; flex-shrink:0; }
  .shortcut-del {
    width:26px; height:26px; border-radius:6px; border:1px solid #f5544d; color:#f5544d; cursor:pointer;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .shortcut-del:hover { background:#fff2f1; }
  .shortcut-del svg { width:14px; height:14px; }
  .add-shortcut-btn {
    display:inline-flex; align-items:center; justify-content:center; gap:4px; margin-top:10px;
    font-size:13px; color:#2f9bff; cursor:pointer; border:1px solid #2f9bff; border-radius:16px;
    padding:7px 20px; background:#fff;
  }
  .add-shortcut-btn:hover { background:#f7fbff; }
  .add-shortcut-btn.disabled { color:#c7cdd6; border-color:#dfe3e8; cursor:not-allowed; background:#fff; }
  .shortcut-tip { font-size:12px; color:#b7bec9; margin-top:8px; }
  .shortcut-num {
    width:46px; border:1px solid #dfe3e8; border-radius:4px; text-align:center;
    font-size:13px; color:#333; padding:4px 2px; background:#fff;
  }
  .shortcut-num:focus { outline:none; border-color:#2f9bff; }
  .shortcut-unit {
    border:1px solid #dfe3e8; border-radius:4px; font-size:13px; color:#333; padding:4px 6px; background:#fff;
  }
  .shortcut-unit:focus { outline:none; border-color:#2f9bff; }
</style>
</head>
<body>

<div class="page">

  <div class="section-head">
    <span class="section-title">日程配置：</span>
    <span class="section-tip">提示：面试开始后，请谨慎修改日程配置，可能导致部分已有数据丢失。</span>
    <span class="collapse-btn">收起 ⌃</span>
  </div>

  <div class="item-row">
    <div class="item-checkbox checked" id="item-checkbox" onclick="toggleItem()">✓</div>
    <div class="item-icon on">⏱</div>
    <div class="item-body">
      <div class="item-title">计时器默认时长</div>
      <div class="item-desc">
        开启后，可设置计时器的默认时长和常用时长。默认时长将自动显示在计时器中，常用时长可通过快捷选项快速选择。
      </div>

      <div class="config-block" id="config-block">
        <div class="config-row">
          <span class="config-label">默认时长：</span>
          <input class="hms-input" value="00"/>时 <input class="hms-input" value="00"/>分 <input class="hms-input" value="00"/>秒
        </div>
        <div class="config-row" style="align-items:flex-start;">
          <span class="config-label" style="margin-top:6px;">常用时长：</span>
          <div>
            <div class="shortcut-list" id="shortcut-list"></div>
            <div class="add-shortcut-btn" id="add-shortcut-btn" onclick="addShortcut()">添加常用时长</div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
  const MAX_SHORTCUTS = 4;

  function updateAddBtnState() {
    const list = document.getElementById('shortcut-list');
    const btn = document.getElementById('add-shortcut-btn');
    const count = list.children.length;
    if (count >= MAX_SHORTCUTS) {
      btn.style.display = 'none';
    } else {
      btn.style.display = 'inline-flex';
      btn.textContent = '添加常用时长';
    }
  }

  function renumberShortcuts() {
    const list = document.getElementById('shortcut-list');
    Array.from(list.children).forEach((row, i) => {
      row.querySelector('.shortcut-label').textContent = '常用时长' + (i + 1);
    });
  }

  function addShortcut() {
    const list = document.getElementById('shortcut-list');
    if (list.children.length >= MAX_SHORTCUTS) return;
    const row = document.createElement('div');
    row.className = 'shortcut-row';
    row.innerHTML =
      '<span class="shortcut-label"></span>' +
      '<input class="shortcut-num" value="5"/>' +
      '<select class="shortcut-unit"><option>分钟</option><option>秒</option><option>小时</option></select>' +
      '<span class="shortcut-del" onclick="removeShortcut(this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg></span>';
    list.appendChild(row);
    renumberShortcuts();
    updateAddBtnState();
  }

  function removeShortcut(el) {
    el.closest('.shortcut-row').remove();
    renumberShortcuts();
    updateAddBtnState();
  }

  updateAddBtnState();

  function toggleItem() {
    const cb = document.getElementById('item-checkbox');
    const block = document.getElementById('config-block');
    const checked = cb.classList.toggle('checked');
    cb.textContent = checked ? '✓' : '';
    block.style.display = checked ? 'block' : 'none';
  }
</script>

</body>
</html>
