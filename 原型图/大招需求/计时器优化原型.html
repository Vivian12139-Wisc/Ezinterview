<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>视频会议 - 计时器优化原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f5f6f8; color:#333; }
  a { text-decoration:none; cursor:pointer; }

  /* ===== 顶部导航（视频会议） ===== */
  .topbar {
    height:52px; background:#2f9bff; display:flex; align-items:center; padding:0 20px;
    position:relative; color:#fff;
  }
  .topbar-left { display:flex; align-items:center; gap:8px; }
  .logo-badge {
    width:26px; height:26px; border-radius:6px; background:#fff; color:#2f9bff;
    display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;
  }
  .logo-text { font-weight:600; font-size:14px; }
  .topbar-title {
    position:absolute; left:50%; transform:translateX(-50%);
    font-size:18px; font-weight:600;
  }
  .topbar-right { position:absolute; right:20px; display:flex; align-items:center; gap:18px; font-size:13px; }
  .topbar-right .divider { opacity:.5; }
  .lang-select { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); border-radius:4px; padding:4px 8px; color:#fff; font-size:12px; }
  .exit-btn { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.3); border-radius:4px; padding:5px 14px; font-size:12px; color:#fff; }

  /* ===== 会议信息条 ===== */
  .meeting-bar {
    background:#eef4ff; padding:12px 24px; display:flex; align-items:center; justify-content:space-between;
  }
  .meeting-info { font-size:14px; color:#333; font-weight:600; }
  .meeting-info .meeting-time { color:#666; font-weight:400; margin-left:10px; }
  .timer-trigger-btn {
    border:1px solid #b9d6ff; background:#fff; color:#2f9bff; border-radius:5px;
    padding:7px 18px; font-size:13px; font-weight:500; display:flex; align-items:center; gap:6px;
  }
  .timer-trigger-btn:hover { background:#f0f7ff; }

  /* ===== 视频区域 ===== */
  .video-stage {
    position:relative; height:calc(100vh - 148px); min-height:420px;
    background:#eaf3ff;
  }

  /* ===== 悬浮计时器（新增：页面悬浮显示） ===== */
  .float-timer {
    position:absolute; top:18px; right:18px; z-index:20;
    background:#2f9bff; border:1px solid rgba(255,255,255,0.2);
    border-radius:24px; padding:10px 20px; display:none; align-items:center; gap:12px;
    box-shadow:0 6px 20px rgba(0,0,0,0.25); cursor:grab; user-select:none;
    transition:background .2s, box-shadow .2s;
  }
  .float-timer.active { display:flex; }
  .float-timer .ft-time {
    font-size:24px; font-weight:700; color:#fff; letter-spacing:0.5px; min-width:88px; font-variant-numeric:tabular-nums;
  }
  .float-timer .ft-ring {
    width:8px; height:8px; border-radius:50%; background:#fff; flex-shrink:0; opacity:.85;
  }
  .float-timer.ft-paused .ft-ring { opacity:.5; }
  .float-timer.ft-done { background:#f5544d; }
  .float-timer.ft-done .ft-ring { animation:ft-pulse 1s infinite; }
  @keyframes ft-pulse { 0%,100%{ opacity:1; } 50%{ opacity:.3; } }
  .float-timer .ft-btns { display:flex; align-items:center; gap:2px; }
  .ft-icon-btn {
    width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:13px; background:rgba(255,255,255,0.15);
  }
  .ft-icon-btn:hover { background:rgba(255,255,255,0.3); }

  /* ===== 弹窗 ===== */
  .modal-mask {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45);
    z-index:100; align-items:center; justify-content:center;
  }
  .modal-mask.active { display:flex; }
  .timer-modal-box {
    width:420px; background:#fff; border-radius:10px; overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
  }
  .timer-modal-header {
    padding:20px 24px 8px; display:flex; justify-content:space-between; align-items:center;
  }
  .timer-modal-header span.ttl { font-size:17px; font-weight:600; color:#1a1a1a; }
  .timer-modal-close { cursor:pointer; color:#b7bec9; font-size:16px; }
  .timer-modal-close:hover { color:#555; }
  .timer-modal-body { padding:8px 24px 28px; text-align:center; }

  /* 设置态 */
  .time-picker-row { display:flex; align-items:flex-start; justify-content:center; gap:14px; margin:18px 0 6px; }
  .time-picker-unit { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .picker-arrow { color:#b7bec9; font-size:13px; cursor:pointer; padding:2px 8px; }
  .picker-arrow:hover { color:#2f9bff; }
  .picker-box {
    width:76px; height:66px; background:#f5f6f8; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:28px; font-weight:600; color:#333; cursor:pointer;
  }
  .picker-box:hover { background:#eef4ff; }
  .picker-box.open { background:#eef4ff; box-shadow:0 0 0 2px #2f9bff inset; }
  .picker-label { font-size:12px; color:#8a94a3; }
  .picker-colon { font-size:24px; color:#c7cdd6; margin:0 -2px; align-self:center; padding-top:22px; }

  /* 时长下拉滑动选择 */
  .picker-dropdown {
    display:none; position:absolute; top:76px; left:50%; transform:translateX(-50%);
    width:76px; max-height:190px; overflow-y:auto; background:#fff; border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18); z-index:30; scroll-behavior:smooth;
  }
  .picker-dropdown.open { display:block; }
  .picker-dropdown-item {
    padding:11px 0; font-size:16px; color:#555; text-align:center; cursor:pointer;
  }
  .picker-dropdown-item:hover { background:#f5f6f8; }
  .picker-dropdown-item.selected { background:#2f9bff; color:#fff; font-weight:600; }

  .preset-row { display:flex; justify-content:center; gap:10px; margin:20px 0 22px; flex-wrap:wrap; }
  .preset-pill {
    border:1px solid #b9d6ff; color:#2f9bff; background:#fff; border-radius:16px;
    padding:7px 16px; font-size:13px; cursor:pointer;
  }
  .preset-pill:hover, .preset-pill.selected { background:#2f9bff; color:#fff; }

  .primary-btn {
    width:100%; background:#2f9bff; color:#fff; border-radius:8px; padding:13px; font-size:15px; font-weight:500; border:none;
  }
  .primary-btn:hover { background:#1c8aef; }

  /* 运行态 */
  .ring-wrap { position:relative; width:220px; height:220px; margin:10px auto 26px; }
  .ring-wrap svg { transform:rotate(-90deg); width:220px; height:220px; }
  .ring-bg { fill:none; stroke:#f0f2f5; stroke-width:8; }
  .ring-progress { fill:none; stroke:#2f9bff; stroke-width:8; stroke-linecap:round; transition:stroke-dashoffset .3s linear; }
  .ring-wrap.paused .ring-progress { stroke:#f5a623; }
  .ring-wrap.done .ring-progress { stroke:#f5544d; }
  .ring-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .ring-time { font-size:34px; font-weight:600; color:#333; font-variant-numeric:tabular-nums; }
  .ring-wrap.paused .ring-time { color:#f5a623; }
  .ring-wrap.done .ring-time { color:#f5544d; }
  .ring-status { font-size:13px; color:#b7bec9; margin-top:4px; }

  .btn-row { display:flex; gap:14px; }
  .btn-row .primary-btn { background:#2f9bff; }
  .secondary-btn {
    flex:1; background:#eef4ff; color:#2f9bff; border-radius:8px; padding:13px; font-size:15px; font-weight:500; border:none;
  }
  .secondary-btn:hover { background:#e0edff; }
  .btn-row .primary-btn, .btn-row .secondary-btn { flex:1; }

  .auto-min-hint {
    font-size:12px; color:#b7bec9; margin-top:16px;
  }

  .sound-tip { display:flex; align-items:center; justify-content:center; gap:6px; font-size:12px; color:#8a94a3; margin-top:14px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo-badge">易</div>
    <span class="logo-text">易面</span>
  </div>
  <div class="topbar-title">视频会议</div>
  <div class="topbar-right">
    <span>文A</span>
    <select class="lang-select"><option>简体中文</option></select>
    <span>⏱ 14:25</span>
    <span>👤 ysmsj1</span>
    <button class="exit-btn">退出</button>
  </div>
</div>

<div class="meeting-bar">
  <div class="meeting-info">smsap1 <span class="meeting-time">11:05 ~ 14:00</span></div>
  <button class="timer-trigger-btn" onclick="openSetup()">⏱ 计时器</button>
</div>

<div class="video-stage" id="video-stage">
  <!-- ============ 悬浮计时器（新增） ============ -->
  <div class="float-timer" id="float-timer">
    <span class="ft-ring"></span>
    <span class="ft-time" id="ft-time">00:14:59</span>
  </div>
</div>

<!-- ============ 计时器弹窗 ============ -->
<div class="modal-mask" id="timer-modal-mask">
  <div class="timer-modal-box">
    <div class="timer-modal-header">
      <span class="ttl">计时器</span>
      <span class="timer-modal-close" onclick="closeModal()">✕</span>
    </div>
    <div class="timer-modal-body">

      <!-- 设置态 -->
      <div id="panel-setup">
        <div class="time-picker-row">
          <div class="time-picker-unit">
            <span class="picker-arrow" onclick="adjust('h',1)">▲</span>
            <div class="picker-box" id="disp-h" onclick="toggleDropdown('h')">00</div>
            <div class="picker-dropdown" id="dropdown-h"></div>
            <span class="picker-arrow" onclick="adjust('h',-1)">▼</span>
            <span class="picker-label">时</span>
          </div>
          <span class="picker-colon">:</span>
          <div class="time-picker-unit">
            <span class="picker-arrow" onclick="adjust('m',1)">▲</span>
            <div class="picker-box" id="disp-m" onclick="toggleDropdown('m')">30</div>
            <div class="picker-dropdown" id="dropdown-m"></div>
            <span class="picker-arrow" onclick="adjust('m',-1)">▼</span>
            <span class="picker-label">分</span>
          </div>
          <span class="picker-colon">:</span>
          <div class="time-picker-unit">
            <span class="picker-arrow" onclick="adjust('s',1)">▲</span>
            <div class="picker-box" id="disp-s" onclick="toggleDropdown('s')">00</div>
            <div class="picker-dropdown" id="dropdown-s"></div>
            <span class="picker-arrow" onclick="adjust('s',-1)">▼</span>
            <span class="picker-label">秒</span>
          </div>
        </div>

        <div class="preset-row">
          <div class="preset-pill" onclick="setPreset(5)">5 分钟</div>
          <div class="preset-pill" onclick="setPreset(10)">10 分钟</div>
          <div class="preset-pill" onclick="setPreset(15)">15 分钟</div>
          <div class="preset-pill" onclick="setPreset(20)">20 分钟</div>
          <div class="preset-pill" onclick="setPreset(30)">30 分钟</div>
        </div>

        <button class="primary-btn" onclick="startTimer()">开始计时</button>
      </div>

      <!-- 运行 / 暂停 / 完成态 -->
      <div id="panel-running" style="display:none;">
        <div class="ring-wrap" id="ring-wrap">
          <svg viewBox="0 0 220 220">
            <circle class="ring-bg" cx="110" cy="110" r="100"></circle>
            <circle class="ring-progress" id="ring-progress" cx="110" cy="110" r="100" stroke-dasharray="628" stroke-dashoffset="0"></circle>
          </svg>
          <div class="ring-center">
            <div class="ring-time" id="ring-time">00:14:59</div>
            <div class="ring-status" id="ring-status"></div>
          </div>
        </div>

        <div class="btn-row" id="running-btns">
          <button class="primary-btn" onclick="pauseTimer()">暂停</button>
          <button class="secondary-btn" onclick="resetTimer()">重置</button>
        </div>
        <div class="btn-row" id="paused-btns" style="display:none;">
          <button class="primary-btn" onclick="resumeTimer()">继续</button>
          <button class="secondary-btn" onclick="resetTimer()">重置</button>
        </div>
        <div class="btn-row" id="done-btns" style="display:none;">
          <button class="primary-btn" style="background:#f5544d;" onclick="resetTimer()">重置</button>
        </div>

      </div>

    </div>
  </div>
</div>

<script>
  let hh = 0, mm = 0, ss = 0;
  let totalSeconds = 0, remainSeconds = 0;
  let timerHandle = null;
  let state = 'idle'; // idle | running | paused | done

  function pad(n){ return String(n).padStart(2,'0'); }

  function refreshPickerDisplay() {
    document.getElementById('disp-h').textContent = pad(hh);
    document.getElementById('disp-m').textContent = pad(mm);
    document.getElementById('disp-s').textContent = pad(ss);
    refreshDropdownSelection('h', hh);
    refreshDropdownSelection('m', mm);
    refreshDropdownSelection('s', ss);
  }

  function adjust(unit, delta) {
    if (unit === 'h') hh = Math.min(23, Math.max(0, hh + delta));
    if (unit === 'm') mm = Math.min(59, Math.max(0, mm + delta));
    if (unit === 's') ss = Math.min(59, Math.max(0, ss + delta));
    refreshPickerDisplay();
  }

  // ============ 时长下拉滑动选择 ============
  const dropdownMax = { h: 23, m: 59, s: 59 };
  let dropdownsBuilt = false;

  function buildDropdowns() {
    if (dropdownsBuilt) return;
    dropdownsBuilt = true;
    ['h','m','s'].forEach(unit => {
      const list = document.getElementById('dropdown-' + unit);
      for (let i = 0; i <= dropdownMax[unit]; i++) {
        const item = document.createElement('div');
        item.className = 'picker-dropdown-item';
        item.textContent = pad(i);
        item.dataset.val = i;
        item.onclick = (e) => { e.stopPropagation(); selectDropdownValue(unit, i); };
        list.appendChild(item);
      }
    });
  }

  function refreshDropdownSelection(unit, val) {
    const list = document.getElementById('dropdown-' + unit);
    if (!list) return;
    list.querySelectorAll('.picker-dropdown-item').forEach(el => {
      el.classList.toggle('selected', Number(el.dataset.val) === val);
    });
  }

  function toggleDropdown(unit) {
    buildDropdowns();
    const target = document.getElementById('dropdown-' + unit);
    const isOpen = target.classList.contains('open');
    document.querySelectorAll('.picker-dropdown').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.picker-box').forEach(b => b.classList.remove('open'));
    if (!isOpen) {
      target.classList.add('open');
      document.getElementById('disp-' + unit).classList.add('open');
      refreshDropdownSelection(unit, unit === 'h' ? hh : unit === 'm' ? mm : ss);
      const sel = target.querySelector('.selected');
      if (sel) sel.scrollIntoView({ block:'center' });
    }
  }

  function selectDropdownValue(unit, val) {
    if (unit === 'h') hh = val;
    if (unit === 'm') mm = val;
    if (unit === 's') ss = val;
    refreshPickerDisplay();
    document.querySelectorAll('.picker-dropdown').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.picker-box').forEach(b => b.classList.remove('open'));
  }

  document.addEventListener('click', (e) => {
    if (!e.target.closest('.time-picker-unit')) {
      document.querySelectorAll('.picker-dropdown').forEach(d => d.classList.remove('open'));
      document.querySelectorAll('.picker-box').forEach(b => b.classList.remove('open'));
    }
  });

  function setPreset(minutes) {
    hh = 0; mm = minutes; ss = 0;
    refreshPickerDisplay();
    document.querySelectorAll('.preset-pill').forEach(p => p.classList.remove('selected'));
    event.target.classList.add('selected');
  }

  function openSetup() {
    document.getElementById('timer-modal-mask').classList.add('active');
    if (state === 'idle') {
      document.getElementById('panel-setup').style.display = 'block';
      document.getElementById('panel-running').style.display = 'none';
    } else {
      // 已经在计时/暂停/完成中，直接展开到运行视图
      showRunningPanel();
    }
  }

  function closeModal() {
    document.getElementById('timer-modal-mask').classList.remove('active');
    // 关闭弹窗时，如果计时器正在运行/暂停/完成，自动收起为悬浮窗
    if (state !== 'idle') {
      showFloatTimer();
    }
  }

  function startTimer() {
    totalSeconds = hh * 3600 + mm * 60 + ss;
    if (totalSeconds <= 0) { return; }
    remainSeconds = totalSeconds;
    state = 'running';
    showRunningPanel();
    tick();
    runInterval();
    // 需求：开始计时后自动最小化 + 页面悬浮显示
    document.getElementById('timer-modal-mask').classList.remove('active');
    showFloatTimer();
  }

  function runInterval() {
    clearInterval(timerHandle);
    timerHandle = setInterval(() => {
      if (state !== 'running') return;
      remainSeconds--;
      if (remainSeconds <= 0) {
        remainSeconds = 0;
        state = 'done';
        clearInterval(timerHandle);
        playBeep();
      }
      tick();
    }, 1000);
  }

  function tick() {
    const h = Math.floor(remainSeconds / 3600);
    const m = Math.floor((remainSeconds % 3600) / 60);
    const s = remainSeconds % 60;
    const text = `${pad(h)}:${pad(m)}:${pad(s)}`;
    document.getElementById('ring-time').textContent = text;
    document.getElementById('ft-time').textContent = state === 'done' ? '时间已到' : text;

    const ringWrap = document.getElementById('ring-wrap');
    const floatEl = document.getElementById('float-timer');
    ringWrap.classList.remove('paused','done');
    floatEl.classList.remove('ft-paused','ft-done');

    const statusEl = document.getElementById('ring-status');
    if (state === 'paused') {
      ringWrap.classList.add('paused'); floatEl.classList.add('ft-paused');
      statusEl.textContent = '已暂停';
    } else if (state === 'done') {
      ringWrap.classList.add('done'); floatEl.classList.add('ft-done');
      statusEl.textContent = '时间已到';
    } else {
      statusEl.textContent = '';
    }

    const circumference = 628;
    const ratio = totalSeconds > 0 ? remainSeconds / totalSeconds : 0;
    document.getElementById('ring-progress').style.strokeDashoffset = circumference * (1 - ratio);

    document.getElementById('running-btns').style.display = state === 'running' ? 'flex' : 'none';
    document.getElementById('paused-btns').style.display = state === 'paused' ? 'flex' : 'none';
    document.getElementById('done-btns').style.display = state === 'done' ? 'flex' : 'none';
  }

  function showRunningPanel() {
    document.getElementById('panel-setup').style.display = 'none';
    document.getElementById('panel-running').style.display = 'block';
    tick();
  }

  function showFloatTimer() {
    document.getElementById('float-timer').classList.add('active');
  }

  function hideFloatTimer() {
    document.getElementById('float-timer').classList.remove('active');
  }

  function pauseTimer() { state = 'paused'; tick(); }
  function resumeTimer() { state = 'running'; tick(); }

  function resetTimer() {
    clearInterval(timerHandle);
    state = 'idle';
    remainSeconds = 0; totalSeconds = 0;
    hideFloatTimer();
    document.getElementById('panel-setup').style.display = 'block';
    document.getElementById('panel-running').style.display = 'none';
    document.querySelectorAll('.preset-pill').forEach(p => p.classList.remove('selected'));
  }

  // 需求：倒计时结束增加提示音（Web Audio 生成蜂鸣，无需外部音频文件）
  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      let t = ctx.currentTime;
      for (let i = 0; i < 3; i++) {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, t);
        gain.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.3);
        t += 0.4;
      }
    } catch (e) { /* 部分浏览器需用户交互后才允许播放，原型环境忽略 */ }
  }

  // 悬浮窗拖动
  (function enableDrag() {
    const el = document.getElementById('float-timer');
    const stage = document.getElementById('video-stage');
    let dragging = false, offsetX = 0, offsetY = 0;
    el.addEventListener('mousedown', (e) => {
      if (e.target.closest('.ft-icon-btn')) return;
      dragging = true;
      el.style.cursor = 'grabbing';
      const rect = el.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      e.preventDefault();
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const stageRect = stage.getBoundingClientRect();
      let x = e.clientX - stageRect.left - offsetX;
      let y = e.clientY - stageRect.top - offsetY;
      x = Math.max(0, Math.min(stageRect.width - el.offsetWidth, x));
      y = Math.max(0, Math.min(stageRect.height - el.offsetHeight, y));
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.right = 'auto';
    });
    document.addEventListener('mouseup', () => {
      if (dragging) { dragging = false; el.style.cursor = 'grab'; }
    });
  })();

  refreshPickerDisplay();
</script>

</body>
</html>
