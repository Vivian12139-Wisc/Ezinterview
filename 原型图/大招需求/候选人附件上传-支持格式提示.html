<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>候选人附件上传</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#fff; color:#333; }
  .page { max-width:760px; margin:0 auto; padding:40px 24px 60px; }

  .form-row { margin-bottom:26px; }
  .form-label { font-size:15px; font-weight:600; color:#1a1a1a; margin-bottom:10px; }
  .form-label .req { font-weight:400; color:#8a94a3; font-size:13px; }
  .form-input {
    width:100%; border:1px solid #dfe3e8; border-radius:6px; padding:11px 14px; font-size:14px; color:#333;
  }
  .form-input:focus { outline:none; border-color:#2f9bff; }
  .radio-group { display:flex; gap:60px; padding:8px 0; }
  .radio-item { display:flex; align-items:center; gap:8px; font-size:14px; color:#333; }
  .radio-item input { accent-color:#2f9bff; width:16px; height:16px; }

  .upload-box {
    border:1px dashed #dfe3e8; border-radius:24px; text-align:center; padding:13px;
    font-size:14px; color:#8a94a3; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .upload-box:hover { border-color:#2f9bff; background:#f7fbff; }
  .upload-box.success { color:#8a94a3; }
  .upload-box .icon { margin-right:6px; }

  .format-hint {
    font-size:12px; color:#b7bec9; margin-top:8px; line-height:1.6;
  }
  .format-hint b { color:#8a94a3; font-weight:500; }

  .upload-file {
    display:flex; align-items:center; gap:8px; font-size:13px; color:#555; margin-top:10px;
  }
  .file-remove { color:#b7bec9; cursor:pointer; margin-left:2px; }
  .file-remove:hover { color:#f5544d; }

  .upload-error {
    display:none; align-items:center; gap:6px; font-size:12px; color:#f5544d; margin-top:8px;
  }
  .upload-error.show { display:flex; }

  /* ===== 上传中弹窗 ===== */
  .convert-modal-mask {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.35);
    z-index:100; align-items:center; justify-content:center;
  }
  .convert-modal-mask.active { display:flex; }
  .convert-modal-box {
    width:280px; background:#fff; border-top:3px solid #333;
    padding:36px 24px 44px; text-align:center;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
  }
  .convert-title { font-size:15px; font-weight:700; color:#1a1a1a; margin-bottom:24px; }
  .convert-text { font-size:14px; color:#999; }

  .submit-btn {
    display:block; width:220px; margin:36px auto 0; background:#2f9bff; color:#fff; border:none;
    border-radius:24px; padding:13px; font-size:15px; font-weight:500;
  }
  .submit-btn:hover { background:#1c8aef; }
</style>
</head>
<body>

<div class="page">

  <!-- 参考附件1 -->
  <div class="form-row">
    <div class="form-label">参考附件1</div>
    <div class="upload-box" id="box-1" onclick="document.getElementById('file-input-1').click()">
      <span class="icon">☁</span>点击上传
    </div>
    <input type="file" id="file-input-1" style="display:none;" accept=".txt,.doc,.docx,.pdf,.html,.htm" onchange="handleFileSelect(this, 1)">
    <div class="format-hint">支持上传 <b>TXT、Word、PDF</b> 格式，上传后将自动转换为 PDF；暂不支持 HTML 格式文件</div>
    <div class="upload-error" id="error-1">不支持 HTML 格式文件，请上传 TXT、Word 或 PDF 格式</div>
    <div class="upload-file" id="file-1" style="display:none;"><span>📎</span> <span class="fname"></span> <span class="file-remove">✕</span></div>
  </div>


</div>

<!-- ============ 转换中弹窗 ============ -->
<div class="convert-modal-mask" id="convert-modal-mask">
  <div class="convert-modal-box">
    <div class="convert-title">提示</div>
    <div class="convert-text">正在上传中...</div>
  </div>
</div>

<script>
  const HTML_EXT = ['html', 'htm'];

  function getExt(filename) {
    const parts = filename.split('.');
    return parts.length > 1 ? parts.pop().toLowerCase() : '';
  }

  function getBaseName(filename) {
    const ext = getExt(filename);
    return ext ? filename.slice(0, -(ext.length + 1)) : filename;
  }

  function handleFileSelect(input, idx) {
    const file = input.files && input.files[0];
    if (!file) return;

    const box = document.getElementById('box-' + idx);
    const errorTag = document.getElementById('error-' + idx);
    const fileTag = document.getElementById('file-' + idx);
    const ext = getExt(file.name);

    errorTag.classList.remove('show');
    fileTag.style.display = 'none';

    if (HTML_EXT.includes(ext)) {
      // HTML 格式不支持，直接拦截提示，不进入上传流程
      errorTag.classList.add('show');
      input.value = '';
      return;
    }

    // TXT / Word / PDF：弹出"正在上传中"，完成后文件名统一变为 .pdf
    document.getElementById('convert-modal-mask').classList.add('active');
    setTimeout(() => {
      document.getElementById('convert-modal-mask').classList.remove('active');
      box.innerHTML = '<span class="icon">☁</span>上传成功';
      const pdfName = getBaseName(file.name) + '.pdf';
      fileTag.style.display = 'flex';
      fileTag.querySelector('.fname').textContent = pdfName;
      input.value = '';
    }, 1500);
  }
</script>

</body>
</html>
