<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>修改密码原型</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background:#f5f6f8; color:#333; }
  a { text-decoration:none; cursor:pointer; }

  /* ===== 页头 ===== */
  .topbar {
    height:52px; background:#2f9bff; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; position:relative; color:#fff;
  }
  .topbar-right { display:flex; align-items:center; gap:22px; font-size:14px; }
  .topbar-item { display:flex; align-items:center; gap:6px; cursor:pointer; color:#fff; position:relative; }
  .topbar-item .arrow { font-size:11px; opacity:.85; }

  /* 用户下拉 */
  .user-dropdown-wrap { position:relative; }
  .user-panel {
    display:none; position:absolute; top:44px; right:0; width:180px; background:#fff; border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,0.18); overflow:hidden; z-index:50;
  }
  .user-panel.open { display:block; }
  .user-panel .uname {
    padding:16px 18px; font-size:15px; font-weight:600; color:#1a1a1a; text-align:center;
  }
  .user-panel .divider { border-top:1px solid #f0f2f5; }
  .user-panel .panel-item {
    display:block; padding:13px 18px; text-align:center; font-size:14px; color:#2f9bff; cursor:pointer;
  }
  .user-panel .panel-item:hover { background:#f7fbff; }
  .user-panel .panel-item.danger { color:#f5544d; }

  /* ===== 页面主体（示意，沿用原页面风格） ===== */
  .body-bar { padding:16px 24px; display:flex; align-items:center; gap:16px; }
  .leave-btn {
    color:#f5544d; background:#fff2f1; border:1px solid #ffd9d6; border-radius:6px;
    padding:8px 20px; font-size:13px;
  }
  .search-box {
    border:1px solid #dfe3e8; border-radius:20px; padding:8px 16px; font-size:13px; color:#999; width:220px;
  }

  /* ===== 修改密码弹窗 ===== */
  .modal-mask {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.45);
    z-index:100; align-items:center; justify-content:center;
  }
  .modal-mask.active { display:flex; }
  .modal-box {
    width:420px; background:#fff; border-radius:10px; overflow:hidden;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
  }
  .modal-header {
    padding:18px 24px; border-bottom:1px solid #ebedf0; font-size:16px; font-weight:600;
    color:#1a1a1a; display:flex; justify-content:space-between; align-items:center;
  }
  .modal-close { cursor:pointer; color:#8a94a3; font-size:15px; }
  .modal-close:hover { color:#333; }
  .modal-body { padding:24px 28px 8px; }
  .modal-footer { padding:16px 24px 24px; display:flex; gap:12px; }

  .form-row { margin-bottom:20px; }
  .form-label { display:block; font-size:13px; color:#555; margin-bottom:8px; }
  .form-input-wrap { position:relative; }
  .form-input {
    width:100%; border:1px solid #dfe3e8; border-radius:6px; padding:10px 40px 10px 12px;
    font-size:14px; color:#333;
  }
  .form-input:focus { outline:none; border-color:#2f9bff; }
  .toggle-eye {
    position:absolute; right:12px; top:50%; transform:translateY(-50%); color:#b7bec9; font-size:14px; cursor:pointer;
  }
  .form-hint { font-size:12px; color:#b7bec9; margin-top:6px; }
  .form-error { font-size:12px; color:#f5544d; margin-top:6px; display:none; }

  .primary-btn {
    flex:1; background:#2f9bff; color:#fff; border-radius:6px; padding:11px; font-size:14px; font-weight:500; border:none;
  }
  .primary-btn:hover { background:#1c8aef; }
  .cancel-btn {
    flex:1; background:#f5f6f8; color:#555; border-radius:6px; padding:11px; font-size:14px; border:none;
  }
  .cancel-btn:hover { background:#ebedf0; }
</style>
</head>
<body>

<div class="topbar">
  <div></div>
  <div class="topbar-right">
    <div class="topbar-item">
      <span>T T</span><span>正常</span><span class="arrow">⌄</span>
    </div>
    <div class="topbar-item">
      <span>文A</span><span>中文简体</span><span class="arrow">⌄</span>
    </div>

    <div class="user-dropdown-wrap">
      <div class="topbar-item" onclick="toggleUserPanel()">
        <span>👤</span><span>ysmsg1</span><span class="arrow">⌄</span>
      </div>
      <div class="user-panel" id="user-panel">
        <div class="uname">ysmsg1</div>
        <div class="divider"></div>
        <div class="panel-item" onclick="openPwdModal()">修改密码</div>
        <div class="divider"></div>
        <div class="panel-item danger">退出登录</div>
      </div>
    </div>
  </div>
</div>

<!-- ============ 修改密码弹窗 ============ -->
<div class="modal-mask" id="pwd-modal-mask">
  <div class="modal-box">
    <div class="modal-header">
      <span>修改密码</span>
      <span class="modal-close" onclick="closePwdModal()">✕</span>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label class="form-label">原密码</label>
        <div class="form-input-wrap">
          <input type="password" class="form-input" placeholder="请输入原密码">
          <span class="toggle-eye">👁</span>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">新密码</label>
        <div class="form-input-wrap">
          <input type="password" class="form-input" placeholder="请输入新密码">
          <span class="toggle-eye">👁</span>
        </div>
      </div>

      <div class="form-row">
        <label class="form-label">确认新密码</label>
        <div class="form-input-wrap">
          <input type="password" class="form-input" placeholder="请再次输入新密码">
          <span class="toggle-eye">👁</span>
        </div>
        <div class="form-error" id="pwd-mismatch-error">两次输入的密码不一致</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="cancel-btn" onclick="closePwdModal()">取消</button>
      <button class="primary-btn" onclick="closePwdModal()">确认修改</button>
    </div>
  </div>
</div>

<script>
  function toggleUserPanel() {
    document.getElementById('user-panel').classList.toggle('open');
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.user-dropdown-wrap')) {
      document.getElementById('user-panel').classList.remove('open');
    }
  });

  function openPwdModal() {
    document.getElementById('user-panel').classList.remove('open');
    document.getElementById('pwd-modal-mask').classList.add('active');
  }
  function closePwdModal() {
    document.getElementById('pwd-modal-mask').classList.remove('active');
  }
</script>

</body>
</html>
